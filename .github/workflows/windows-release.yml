name: Windows release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller PySide6 numpy
      - name: Validate source syntax
        run: python -m py_compile app/nameless_redux.py app/redux_showroom.py app/redux_armory.py app/premium_hero.py app/redux_atlas.py app/fps_lab.py app/ping_lab.py app/ping_history.py app/lag_report.py app/ui_controls.py app/startup_brand.py app/art_pack.py launcher.py
      - name: Validate all Redux pack manifests
        run: python tests/validate_packs.py
      - name: Headless UI smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_ui.py
      - name: Interactive Redux showroom smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/showroom_smoke.py
      - name: Cosmetic Garage smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/garage_smoke.py
      - name: REDUX Atlas smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/atlas_smoke.py
      - name: FPS LAB smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/fps_lab_smoke.py
      - name: PING LAB smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/ping_lab_smoke.py
      - name: PING LAB history smoke test
        shell: pwsh
        run: python tests/ping_history_smoke.py
      - name: ROB RUN lag report smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/lag_report_smoke.py
      - name: Startup branding smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/startup_brand_smoke.py
      - name: REDUX realistic art pack smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/art_pack_smoke.py
      - name: Build app
        shell: pwsh
        run: |
          $assets = @()
          if (Test-Path "app/assets") {
            $images = @(Get-ChildItem "app/assets" -File -Include *.jpg,*.jpeg,*.png -Recurse)
            foreach ($image in $images) {
              $assets += @("--add-data", "$($image.FullName);assets")
            }
          }
          & pyinstaller --noconfirm --clean --onefile --windowed --name "NAMELESS REDUX" @assets app/nameless_redux.py
      - name: Build launcher
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "NAMELESS Launcher" launcher.py
      - name: Package app and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/NAMELESS REDUX.exe" -DestinationPath "nameless-redux-app.zip"
          $hash = (Get-FileHash "nameless-redux-app.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nameless-redux-app.zip" | Set-Content -Encoding ascii "nameless-redux-app.zip.sha256"
      - name: Verify packaged Windows release
        shell: pwsh
        run: |
          $app = "dist/NAMELESS REDUX.exe"
          $launcher = "dist/NAMELESS Launcher.exe"
          $archive = "nameless-redux-app.zip"
          $checksum = "nameless-redux-app.zip.sha256"
          foreach ($file in @($app, $launcher, $archive, $checksum)) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) {
              throw "Missing or empty release artifact: $file"
            }
          }
          Add-Type -AssemblyName System.IO.Compression
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $archive).Path)
          try {
            if ($zip.Entries.Count -ne 1 -or -not ($zip.Entries | Where-Object { $_.Name -eq "NAMELESS REDUX.exe" })) {
              throw "Application executable missing from ZIP"
            }
          } finally {
            $zip.Dispose()
          }
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = (Get-Content $checksum -Raw).Trim().Split(' ')[0]
          if ($actual -ne $expected) { throw "ZIP SHA256 checksum mismatch" }
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: nameless-redux-windows
          path: |
            dist/NAMELESS Launcher.exe
            nameless-redux-app.zip
            nameless-redux-app.zip.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NAMELESS Launcher.exe
            nameless-redux-app.zip
            nameless-redux-app.zip.sha256

